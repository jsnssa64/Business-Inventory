version: '3.8'

services:
  eventstore:
    image: eventstore/eventstore:latest
    container_name: eventstore
    ports:
      - "2113:2113"
      - "1113:1113"
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_EXT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true

  inventory-api:
    build:
      context: ./inventory-api
      dockerfile: Dockerfile
    container_name: inventory-api
    ports:
      - "5000:5000"
    depends_on:
      - inventory-db
      - eventstore
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=inventory-db;Database=Inventory;User Id=sa;Password=YourStrong!Passw0rd;

  inventory-ui:
    build:
      context: ./inventory-ui
      dockerfile: Dockerfile
    container_name: inventory-ui
    ports:
      - "3000:3000"
    depends_on:
      - inventory-api
  inventory-db:
    build:
      context: ./inventory-db
      dockerfile: Dockerfile
    container_name: inventory-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd