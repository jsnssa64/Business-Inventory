version: '3.8'

services:
  inventory-api:
    build:
      context: ./Inventory-API
      dockerfile: Dockerfile
    container_name: inventory-api
    restart: always
    ports:
      - "3001:8080"
      - "3002:8081"
    depends_on:
      - inventory-db
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__InventoryDb=${INVENTORY_DB_CONNECTION}

  inventory-db:
    build:
      context: ./Inventory-DB/InventoryDb
      dockerfile: Dockerfile
      args:
        - BIN_MODE=${BIN_MODE}
    container_name: inventory-db
    ports:
      - "${INVENTORY_DB_HOST_PORT}:1433"
    volumes:
      - db_data:/var/opt/mssql      
    # secrets:
    #   - db_password
    #   - sa_password
    environment:
      - ACCEPT_EULA=${MSSQL_ACCEPT_EULA}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=${MSSQL_PID}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}

volumes:
   db_data:
     driver: local

networks:
  default:
    driver: bridge

