apiVersion: batch/v1
kind: CronJob
metadata:
  name: example-cronjob
  namespace: default
spec:
  schedule: "0 2 * * *"  # 2 AM daily
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: example-container
            image: example-image:latest
            command:
            - /bin/sh
            - -c
            - echo "Running scheduled task"
          restartPolicy: OnFailure