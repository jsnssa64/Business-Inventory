name: secrets

on:
    #   PR Created
    pull_request:
    #   After commited to master
    push: 
        branches: [master]

permissions:
    contents: read
    pull-requests: write

jobs:
    scan:
        name: gitleaks
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
                #   Get All History to be scanned
                with:
                    fetch-depth: 0
            -   uses: gitleaks/gitleaks-action@v3
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}